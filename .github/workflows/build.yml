name: Build Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant gradlew
        run: chmod +x ./gradlew || true
      - name: Build
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            **/*.apk
            **/*.aab
